<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='10' height='32' fill='%231d4ed8'/><rect x='11' width='10' height='32' fill='%23e9820c'/><rect x='22' width='10' height='32' fill='%2314804a'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCES 2023-24 — Data Catalog</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e4e7ec;
    --border-strong: #c8cfd9;
    --ink: #101828;
    --ink-2: #344054;
    --muted: #5f6b7d;
    --accent: #1d4ed8;
    --accent-soft: #eaf0fe;
    --saffron: #e9820c;
    --green: #14804a;
    --purple: #6d28d9;
    --teal: #0e9f8a;
    --amber: #b45309;
    --rose: #be123c;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3 { text-wrap: balance; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); border: 1px solid var(--border); flex-shrink: 0; }
  .brand-mark i { display: block; flex: 1; }
  .brand-mark .s { background: var(--saffron); }
  .brand-mark .w { background: #ffffff; position: relative; }
  .brand-mark .w::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
  .brand-mark .g { background: var(--green); }
  .brand h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { font-size: 0.78rem; color: var(--muted); }
  .nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .nav a { color: var(--accent); font-size: 0.86rem; font-weight: 550; text-decoration: none; padding: 6px 12px; border-radius: 8px; }
  .nav a:hover { background: var(--accent-soft); }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 32px 56px; }
  .toolbar { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.76rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  input[type="text"] { background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); font: inherit; font-size: 0.9rem; padding: 9px 14px; border-radius: 8px; width: 320px; }
  input[type="text"]::placeholder { color: #8a94a3; }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 0.85rem; }

  .table-list { display: flex; flex-direction: column; gap: 14px; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; animation: rise 0.3s ease-out both; }
  .table-head { padding: 16px 22px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: background 0.12s ease; }
  .table-head:hover { background: var(--surface-2); }
  .table-head h3 { font-size: 1rem; color: var(--accent); font-weight: 650; }
  .table-head .desc { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
  .table-head .meta { color: var(--muted); font-size: 0.8rem; text-align: right; white-space: nowrap; }
  .table-head .meta .big { font-size: 1.05rem; color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  .expand { color: var(--accent); font-size: 0.8rem; font-weight: 550; display: flex; align-items: center; gap: 6px; }

  .columns { display: none; padding: 0 22px 18px; }
  .columns.open { display: block; animation: rise 0.25s ease-out both; }
  .table-scroll { max-height: 460px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 650; background: var(--surface-2); position: sticky; top: 0; z-index: 1; font-size: 0.76rem; letter-spacing: 0.03em; text-transform: uppercase; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f8fafc; }
  .col-name { font-weight: 600; color: var(--ink); }
  .meaning { color: var(--purple); font-size: 0.74rem; margin-top: 2px; }
  .type { color: var(--purple); font-family: Consolas, "Cascadia Mono", monospace; font-size: 0.78rem; }
  .num { color: var(--teal); font-variant-numeric: tabular-nums; }
  .warn { color: var(--amber); font-variant-numeric: tabular-nums; }
  .vals { color: var(--ink-2); font-size: 0.78rem; max-width: 300px; }
  .vals span { display: inline-block; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; margin: 1px 2px; font-size: 0.74rem; font-variant-numeric: tabular-nums; }
  .vals .c { color: var(--muted); }
  .vals .hi { color: var(--muted); font-style: italic; }

  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  @media (max-width: 820px) {
    .header-inner { padding: 12px 16px; }
    .brand .sub { display: none; }
    .wrap { padding: 18px 16px 40px; }
    .toolbar { gap: 12px; }
    input[type="text"] { width: 100%; }
    .table-head { flex-direction: column; align-items: flex-start; }
    .table-head .meta { text-align: left; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 680px; }
  }

  @media (max-width: 480px) {
    .header-inner { padding: 10px 14px; }
    .brand-mark { width: 26px; height: 26px; }
    .brand h1 { font-size: 0.92rem; }
    .wrap { padding: 14px 14px 32px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .table-head { padding: 14px 16px; }
    .columns { padding: 0 16px 14px; }
    .expand { display: none; }
    .summary { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i class="s"></i><i class="w"></i><i class="g"></i></div>
      <div>
        <h1>HCES 2023-24 · Data Catalog</h1>
        <div class="sub">Every table, column &amp; category value available for analysis</div>
      </div>
    </div>
    <nav class="nav"><a href="/">← Dashboard</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="field">
      <label for="search">Search</label>
      <input id="search" type="text" placeholder="Try: consumption, Energy, Gender, Item_Code…" oninput="applyFilter()">
    </div>
    <span class="summary" id="summary">Loading catalog…</span>
  </div>
  <div class="table-list" id="list"></div>
</main>

<script src="js/metadata.js"></script>
</body>
</html>
