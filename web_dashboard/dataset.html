<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='10' height='32' fill='%231d4ed8'/><rect x='11' width='10' height='32' fill='%23e9820c'/><rect x='22' width='10' height='32' fill='%2314804a'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCES 2023-24 — Raw Data</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6;
    --border: #e4e7ec; --border-strong: #c8cfd9;
    --ink: #101828; --ink-2: #344054; --muted: #5f6b7d;
    --accent: #1d4ed8; --accent-soft: #eaf0fe;
    --saffron: #e9820c; --green: #14804a; --purple: #6d28d9;
    --teal: #0e9f8a; --amber: #b45309; --rose: #be123c;
    --radius: 12px; --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3 { text-wrap: balance; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .header-inner { max-width: 1500px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { font-size: 0.78rem; color: var(--muted); }
  .nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .nav a { color: var(--accent); font-size: 0.86rem; font-weight: 550; text-decoration: none; padding: 6px 12px; border-radius: 8px; }
  .nav a:hover { background: var(--accent-soft); }

  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px 32px 56px; }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.015em; }
  .page-head h1 code { font-family: Consolas, "Cascadia Mono", monospace; color: var(--accent); }
  .page-head .desc { color: var(--muted); font-size: 0.88rem; margin-top: 3px; }
  .page-head .meta { color: var(--muted); font-size: 0.84rem; text-align: right; white-space: nowrap; }
  .page-head .meta .big { font-size: 1.05rem; color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px 20px; margin-bottom: 16px; }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.72rem; font-weight: 650; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
  select { background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); font: inherit; font-size: 0.86rem; padding: 7px 10px; border-radius: 8px; min-width: 130px; max-width: 240px; }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .filters .all { color: var(--muted); font-size: 0.8rem; align-self: flex-end; margin-bottom: 8px; }
  .rawtag { font-size: 0.62rem; font-weight: 650; color: var(--amber); background: #fef6e9; border: 1px solid #f2d9a8; border-radius: 5px; padding: 1px 6px; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
  .raw-note { width: 100%; color: var(--muted); font-size: 0.76rem; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .summary { color: var(--muted); font-size: 0.85rem; }
  .summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .btn { background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink-2); font: inherit; font-size: 0.84rem; font-weight: 550; padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .colpick { display: none; margin-bottom: 14px; }
  .colpick.open { display: block; animation: rise 0.2s ease-out both; }
  .colpick .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; max-height: 260px; overflow-y: auto; margin-top: 10px; }
  .colpick label { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-2); padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  .colpick label:hover { background: var(--surface-2); }
  .colpick label .t { color: var(--muted); font-size: 0.72rem; }
  .colpick input { accent-color: var(--accent); }
  .colpick .actions { display: flex; gap: 10px; margin-top: 10px; }

  .table-scroll { overflow: auto; max-height: 66vh; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 650; background: var(--surface-2); position: sticky; top: 0; z-index: 1; font-size: 0.72rem; letter-spacing: 0.03em; text-transform: uppercase; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num { color: var(--teal); }
  td.null { color: #aab2bf; font-style: italic; }
  tbody tr:nth-child(even) td { background: #fafbfc; }
  tbody tr:hover td { background: var(--accent-soft); }
  .raw { color: var(--muted); font-size: 0.72rem; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .pager .btn:disabled { opacity: 0.4; cursor: default; border-color: var(--border); color: var(--muted); }
  .pager .info { color: var(--muted); font-size: 0.84rem; }
  .pager .info b { color: var(--ink); }

  .error { color: var(--rose); background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 14px 18px; font-size: 0.88rem; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
  #body.loading-blur .table-scroll { opacity: 0.55; transition: opacity 0.15s ease; }
  .summary.busy::after { content: " · loading…"; color: var(--accent); font-style: italic; }

  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  @media (max-width: 820px) {
    .header-inner { padding: 12px 16px; }
    .brand .sub { display: none; }
    .wrap { padding: 18px 16px 40px; }
    .page-head .meta { text-align: left; }
    select { min-width: 110px; }
  }
  @media (max-width: 480px) {
    .header-inner { padding: 10px 14px; }
    .brand h1 { font-size: 0.92rem; }
    .wrap { padding: 14px 14px 32px; }
    .panel { padding: 13px 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div>
        <h1>HCES 2023-24 · Raw Data</h1>
        <div class="sub">Original survey rows, exactly as released</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/metadata">← Catalog</a>
      <a href="/">Dashboard</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head" id="pageHead"></div>

  <div class="panel">
    <div class="filters" id="filters"></div>
  </div>

  <div class="toolbar">
    <span class="summary" id="summary">Loading…</span>
    <button class="btn" id="colBtn" onclick="toggleCols()">Columns…</button>
  </div>

  <div class="colpick" id="colpick">
    <div class="grid" id="colGrid"></div>
    <div class="actions">
      <button class="btn" onclick="setAllCols(true)">All</button>
      <button class="btn" onclick="setAllCols(false)">None</button>
      <button class="btn" onclick="setProvCols()">Chart columns</button>
      <button class="btn" onclick="toggleCols()">Done</button>
    </div>
  </div>

  <div id="body"></div>

  <div class="pager" id="pager" hidden>
    <button class="btn" id="prevBtn" onclick="goto(parseInt(new URLSearchParams(location.search).get('page')||'1',10)-1)">← Prev</button>
    <span class="info" id="pageInfo"></span>
    <button class="btn" id="nextBtn" onclick="goto(parseInt(new URLSearchParams(location.search).get('page')||'1',10)+1)">Next →</button>
    <span class="info">Per page
      <select id="perSel" onchange="setPer(this.value)">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </span>
  </div>
</main>

<script src="/js/dataset.js"></script>
</body>
</html>
